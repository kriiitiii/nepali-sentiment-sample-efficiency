seed: 13
data:
  raw_csv: data/raw/nepcov19tweets/covid19_tweeter_dataset.csv
  near_dup_threshold: 0.85
split:
  test_frac: 0.2
  val_frac: 0.1
learning_curve:
  sizes: [100, 250, 500, 1000, 2500, 5000, 10000, full]
  repeats_small: 5     # sizes <= 2500
  repeats_large: 3     # sizes > 2500
bootstrap:
  n_boot: 2000
char_lr:
  # Full grid, searched once on the full training set.
  full_grid:
    ngram_range: [[1, 3], [1, 4], [2, 5], [1, 6]]
    analyzer: [char_wb, char]
    min_df: [1, 2]
    C: [0.25, 1.0, 4.0, 16.0]
    class_weight: [null, balanced]
  # Reduced grid re-searched at every learning-curve size and repeat.
  curve_grid:
    C: [0.25, 1.0, 4.0, 16.0]
    class_weight: [null, balanced]
models:
  xlmr:
    name: FacebookAI/xlm-roberta-base
    revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
  nepberta:
    # Converted from NepBERTa/NepBERTa revision 1b8293fd5ed883081619e9895540c58eb740e7d0
    # (TensorFlow only) by scripts/convert_nepberta.py.
    name: models_local/nepberta-pt
    revision: null
transformer:
  lr_candidates: [1.0e-5, 2.0e-5, 3.0e-5]
  batch_size: 32
  max_length: 128
  min_steps: 600
  max_epochs: 4
  evals_per_run: 10
  patience: 3
  weight_decay: 0.01
  warmup_ratio: 0.1
